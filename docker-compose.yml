services:
  web:
    build: .
    image: prefa-news:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Execute a news ingestion with a 3 hours interval.
  # Use a simple container with loop + sleep.
  news-fetcher:
    build: .
    image: prefa-news:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/srv/app/data
    entrypoint: >
      sh -c "while true; do
        python -m app.ingestion.fetch_news;
        sleep 10800;
      done"
